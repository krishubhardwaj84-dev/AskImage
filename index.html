<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealismX - Ultimate AI Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

        :root {
            --bg-dark: #050505;
            --panel-bg: #0f0f0f;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #e2e8f0;
        }

        .font-serif-heading {
            font-family: 'Playfair Display', serif;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Glass Panel */
        .glass {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .animate-scan {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: cyan;
            box-shadow: 0 0 10px cyan;
            animation: scan 2s linear infinite;
        }

        /* Motion Mode Animation (Ken Burns Effect - Ultra Smooth) */
        @keyframes pan-zoom {
            0% { transform: scale(1.0) translate(0, 0); }
            50% { transform: scale(1.25) translate(-5%, 2%); }
            100% { transform: scale(1.1) translate(5%, -2%); }
        }
        
        .motion-active {
            animation: pan-zoom 25s ease-in-out infinite alternate;
            will-change: transform;
            transform-origin: center center;
        }

        /* Advanced Loader */
        .loader-container {
            position: relative;
            width: 80px;
            height: 80px;
        }
        
        .spinner {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: cyan;
            border-right-color: purple;
            animation: spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        .spinner-inner {
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 3s linear infinite reverse;
        }

        .spinner-center {
            position: absolute;
            inset: 30px;
            background: cyan;
            border-radius: 50%;
            box-shadow: 0 0 15px cyan;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden bg-[#050505]">

    <!-- Left Sidebar (Controls) -->
    <aside class="w-full md:w-[450px] glass z-20 flex flex-col h-full shadow-2xl">
        <!-- Header -->
        <div class="p-6 border-b border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.4)]">
                    <i class="fa-solid fa-cube text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-serif-heading text-xl font-bold text-white tracking-wide">RealismX</h1>
                    <div class="flex items-center gap-1">
                        <div id="statusIndicator" class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                        <span id="statusText" class="text-[10px] text-gray-400 uppercase tracking-widest">System Online</span>
                    </div>
                </div>
            </div>
            <button onclick="resetAll()" class="text-gray-500 hover:text-white transition" title="Reset">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <!-- Scrollable Controls -->
        <div class="flex-1 overflow-y-auto p-6 space-y-8">
            
            <!-- Prompt Section -->
            <div class="space-y-3">
                <div class="flex justify-between items-end">
                    <label class="text-xs font-semibold text-blue-400 uppercase tracking-wider">Subject & Prompt</label>
                    <div class="flex gap-3">
                        <button onclick="surpriseMe()" class="text-xs flex items-center gap-1 text-green-400 hover:text-green-300 transition cursor-pointer">
                            <i class="fa-solid fa-shuffle"></i> Surprise
                        </button>
                        <button onclick="enhancePrompt()" class="text-xs flex items-center gap-1 text-purple-400 hover:text-purple-300 transition cursor-pointer" title="Add detailed keywords">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Fix
                        </button>
                    </div>
                </div>
                <div class="relative group">
                    <textarea id="promptInput" rows="4" 
                        class="w-full bg-[#111] border border-white/10 rounded-xl p-4 text-sm text-gray-200 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all placeholder-gray-600 resize-none leading-relaxed"
                        placeholder="Describe clearly. Example: Virat Kohli holding a cricket bat, stadium background, cinematic lighting, 8k..."></textarea>
                    <div class="absolute bottom-3 right-3 flex gap-2 z-10">
                         <button onclick="toggleTurbo()" id="turboBtn" class="cursor-pointer px-3 py-1.5 border border-yellow-500/30 bg-yellow-500/10 hover:bg-yellow-500/20 rounded-full text-[10px] font-bold text-yellow-500 transition flex items-center gap-1.5 shadow-[0_0_10px_rgba(234,179,8,0.1)]" title="Turbo Mode: Faster generation, slightly lower resolution">
                            <i class="fa-solid fa-bolt"></i> TURBO: OFF
                        </button>
                    </div>
                </div>
                <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                    <button onclick="insertTag('Portrait of')" class="whitespace-nowrap px-3 py-1 bg-white/5 hover:bg-blue-500/20 border border-white/5 hover:border-blue-500/50 rounded-full text-[10px] text-gray-400 hover:text-blue-400 transition">Portrait</button>
                    <button onclick="insertTag('Full body shot of')" class="whitespace-nowrap px-3 py-1 bg-white/5 hover:bg-blue-500/20 border border-white/5 hover:border-blue-500/50 rounded-full text-[10px] text-gray-400 hover:text-blue-400 transition">Full Body</button>
                    <button onclick="insertTag('Hyper-realistic')" class="whitespace-nowrap px-3 py-1 bg-white/5 hover:bg-blue-500/20 border border-white/5 hover:border-blue-500/50 rounded-full text-[10px] text-gray-400 hover:text-blue-400 transition">Realism</button>
                    <button onclick="insertTag('8k resolution')" class="whitespace-nowrap px-3 py-1 bg-white/5 hover:bg-blue-500/20 border border-white/5 hover:border-blue-500/50 rounded-full text-[10px] text-gray-400 hover:text-blue-400 transition">8K</button>
                    <button onclick="insertTag('Cinematic lighting')" class="whitespace-nowrap px-3 py-1 bg-white/5 hover:bg-blue-500/20 border border-white/5 hover:border-blue-500/50 rounded-full text-[10px] text-gray-400 hover:text-blue-400 transition">Lighting</button>
                </div>
            </div>

            <!-- Settings Grid -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Aspect Ratio -->
                <div class="space-y-2">
                    <label class="text-[10px] text-gray-500 uppercase font-bold">Dimensions</label>
                    <select id="aspectRatio" class="w-full bg-[#111] border border-white/10 rounded-lg p-3 text-sm text-gray-300 focus:border-blue-500 outline-none cursor-pointer hover:bg-[#151515] transition">
                        <option value="1:1">Square (1:1)</option>
                        <option value="16:9" selected>Landscape (16:9)</option>
                        <option value="9:16">Story/Reel (9:16)</option>
                        <option value="4:3">Classic (4:3)</option>
                        <option value="3:2">Photo (3:2)</option>
                        <option value="2:3">Portrait (2:3)</option>
                        <option value="21:9">Cinematic (21:9)</option>
                    </select>
                </div>

                <!-- Art Style -->
                <div class="space-y-2">
                    <label class="text-[10px] text-gray-500 uppercase font-bold">Aesthetics</label>
                    <select id="stylePreset" class="w-full bg-[#111] border border-white/10 rounded-lg p-3 text-sm text-gray-300 focus:border-blue-500 outline-none cursor-pointer hover:bg-[#151515] transition">
                        <option value="hyper-realistic, photorealistic, 8k, detailed texture, sharp focus">Hyper Realism (Default)</option>
                        <option value="cinematic, dramatic lighting, movie scene, color graded, anamorphic lens">Cinematic Movie</option>
                        <option value="analog film, kodak portra 400, grain, vintage, soft focus">Vintage Film</option>
                        <option value="cyberpunk, neon, futuristic, high tech, night city, glowing">Cyberpunk</option>
                        <option value="anime, studio ghibli, vibrant, cel shaded, illustration">Anime Style</option>
                        <option value="3d render, octane render, unreal engine 5, ray tracing, cgi">3D Render</option>
                        <option value="black and white photography, noir, high contrast, dramatic">Black & White</option>
                        <option value="fantasy art, digital painting, concept art, magic, ethereal">Fantasy Art</option>
                        <option value="" selected>No Style (Best for Celebs/Identity)</option>
                    </select>
                </div>
            </div>

            <!-- Toggles -->
            <div class="bg-[#111] rounded-xl p-4 border border-white/5 space-y-4">
                <!-- Motion Toggle -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-purple-500/10 flex items-center justify-center text-purple-400">
                            <i class="fa-solid fa-film text-xs"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-gray-200">Motion Mode</div>
                            <div class="text-[10px] text-gray-500">Simulate camera movement</div>
                        </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="motionToggle" class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-600"></div>
                    </label>
                </div>

                <!-- HD Toggle -->
                <div class="flex items-center justify-between border-t border-white/5 pt-4">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400">
                            <i class="fa-solid fa-high-definition text-xs"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-gray-200">Ultra Detail</div>
                            <div class="text-[10px] text-gray-500">Enhance texture quality</div>
                        </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="hdToggle" checked class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            </div>

        </div>

        <!-- Footer Action -->
        <div class="p-6 border-t border-white/5 bg-[#0a0a0a]">
            <button onclick="generateImage()" id="generateBtn" 
                class="w-full group relative py-4 rounded-xl bg-white text-black font-bold shadow-[0_0_20px_rgba(255,255,255,0.2)] hover:shadow-[0_0_30px_rgba(255,255,255,0.4)] transition-all transform hover:-translate-y-1 active:translate-y-0 overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/50 to-transparent -translate-x-full group-hover:animate-[shimmer_1s_infinite]"></div>
                <span class="relative flex items-center justify-center gap-2">

        </div>
    </aside>

    <!-- Main Content (Canvas) -->
    <main class="flex-1 relative flex flex-col h-full overflow-hidden bg-[#020202]">
        
        <!-- Top Bar -->
        <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-30 pointer-events-none">
            <div class="pointer-events-auto">
                <!-- Placeholder for future tabs -->
            </div>
            <div class="flex gap-2 pointer-events-auto">
                 <button onclick="toggleHistory()" class="px-4 py-2 bg-black/50 border border-white/10 rounded-full text-xs text-gray-300 hover:bg-white/10 backdrop-blur transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-clock-rotate-left"></i> History
                </button>
            </div>
        </div>

        <!-- Canvas Center -->
        <div class="flex-1 flex items-center justify-center p-4 md:p-10 relative">
            
            <!-- Background Ambient -->
            <div class="absolute inset-0 overflow-hidden pointer-events-none">
                <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-900/10 rounded-full blur-[100px]"></div>
                <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-900/10 rounded-full blur-[100px]"></div>
            </div>

            <!-- Image Holder -->
            <div id="imageContainer" class="relative group max-w-full max-h-full transition-all duration-500 flex items-center justify-center">
                
                <!-- Empty State -->
                <div id="emptyState" class="text-center space-y-4 opacity-40">
                    <div class="w-20 h-20 border border-dashed border-gray-600 rounded-2xl mx-auto flex items-center justify-center">
                        <i class="fa-solid fa-image text-2xl text-gray-600"></i>
                    </div>
                    <p class="text-sm text-gray-500 font-mono">Ready to visualize...</p>
                </div>

                <!-- Loader -->
                <div id="loadingState" class="hidden absolute inset-0 bg-black/90 backdrop-blur-xl rounded-lg flex flex-col items-center justify-center z-50">
                    <div class="loader-container mb-6">
                        <div class="spinner"></div>
                        <div class="spinner-inner"></div>
                        <div class="spinner-center"></div>
                    </div>
                    <div class="text-cyan-400 text-sm font-mono tracking-[0.2em] uppercase animate-pulse font-bold">Constructing Reality</div>
                    <div class="mt-2 text-gray-500 text-xs flex items-center gap-2">
                        <i class="fa-solid fa-microchip"></i>
                        <span id="loadingText">Parsing subject identity...</span>
                    </div>
                </div>

                <!-- Result Image -->
                <img id="resultImage" src="" alt="Generated" 
                    class="hidden max-w-full max-h-[85vh] object-contain shadow-[0_0_50px_rgba(0,0,0,0.8)] rounded-lg transition-transform duration-1000">

                <!-- Action Menu (On Hover) -->
                <div id="actionMenu" class="hidden absolute bottom-4 flex gap-2 bg-black/60 backdrop-blur-xl border border-white/10 p-2 rounded-2xl shadow-xl opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0">
                    <button onclick="downloadImage()" class="w-10 h-10 rounded-xl hover:bg-white/20 text-white flex items-center justify-center transition" title="Download">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <button onclick="toggleFullscreen()" class="w-10 h-10 rounded-xl hover:bg-white/20 text-white flex items-center justify-center transition" title="Fullscreen">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                    <div class="w-px h-6 bg-white/20 my-auto"></div>
                    <button onclick="shareImage()" class="w-10 h-10 rounded-xl hover:bg-blue-500/20 text-blue-400 flex items-center justify-center transition" title="Share">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- History Sidebar (Hidden by default) -->
        <div id="historyPanel" class="absolute top-0 right-0 h-full w-80 bg-[#0f0f0f] border-l border-white/10 transform translate-x-full transition-transform duration-300 z-40 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-white/10 flex justify-between items-center">
                <h3 class="font-bold text-white">History</h3>
                <button onclick="toggleHistory()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="historyGrid" class="flex-1 overflow-y-auto p-4 space-y-4">
                <p class="text-center text-gray-600 text-xs mt-10">No history yet</p>
            </div>
        </div>

    </main>

    <script>
        // --- State ---
        const state = {
            isGenerating: false,
            currentUrl: null,
            currentPrompt: null,
            history: [],
            turbo: false
        };

        // --- Elements ---
        const els = {
            prompt: document.getElementById('promptInput'),
            ratio: document.getElementById('aspectRatio'),
            style: document.getElementById('stylePreset'),
            motion: document.getElementById('motionToggle'),
            hd: document.getElementById('hdToggle'),
            btn: document.getElementById('generateBtn'),
            imgContainer: document.getElementById('imageContainer'),
            img: document.getElementById('resultImage'),
            loader: document.getElementById('loadingState'),
            empty: document.getElementById('emptyState'),
            actions: document.getElementById('actionMenu'),
            historyPanel: document.getElementById('historyPanel'),
            historyGrid: document.getElementById('historyGrid'),
            turboBtn: document.getElementById('turboBtn'),
            loadingText: document.getElementById('loadingText')
        };

        // --- Actions ---

        const surprisePrompts = [
            "A futuristic city floating in the clouds, golden hour lighting, hyper-realistic, 8k",
            "A close-up of a mechanical eye with intricate gears, cyberpunk style, neon reflections",
            "A serene japanese garden with cherry blossoms falling into a koi pond, cinematic",
            "An astronaut sitting on a folding chair on the moon looking at earth, high detail",
            "A transparent glass lion sculpture in a dark room with red laser lighting",
            "A cozy cabin in a snowy forest at night, warm window light, volumetric fog",
            "A majestic phoenix made of fire and ash rising from a volcano, epic scale",
            "Portrait of an elderly woman with wise eyes, detailed skin texture, rembrandt lighting"
        ];

        function surpriseMe() {
            const randomPrompt = surprisePrompts[Math.floor(Math.random() * surprisePrompts.length)];
            els.prompt.value = randomPrompt;
            
            // Flash effect
            els.prompt.classList.add('bg-[#222]');
            setTimeout(() => els.prompt.classList.remove('bg-[#222]'), 200);
        }

        function insertTag(tag) {
            const currentVal = els.prompt.value;
            if (tag.endsWith('of')) {
                 // Prepend tags like "Portrait of"
                 els.prompt.value = tag + ' ' + currentVal;
            } else {
                // Append other tags
                if (currentVal.length > 0 && !currentVal.trim().endsWith(',')) {
                    els.prompt.value += ', ' + tag;
                } else {
                    els.prompt.value += tag;
                }
            }
            els.prompt.focus();
        }

        function enhancePrompt() {
            const val = els.prompt.value;
            if(!val) return;
            
            // Smart enhancement that doesn't ruin the subject
            const subjects = ["portrait", "landscape", "view", "shot"];
            let base = val;
            
            if (!base.toLowerCase().includes('realistic') && !base.toLowerCase().includes('8k')) {
                base += ", hyper-realistic, 8k uhd, highly detailed, professional photography";
            }
            els.prompt.value = base;
        }

        function toggleTurbo() {
            state.turbo = !state.turbo;
            if(state.turbo) {
                els.turboBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> Turbo: ON`;
                els.turboBtn.classList.remove('text-yellow-500', 'border-yellow-500/30', 'bg-yellow-500/10');
                els.turboBtn.classList.add('text-green-400', 'border-green-500/30', 'bg-green-500/10');
            } else {
                els.turboBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> Turbo: OFF`;
                els.turboBtn.classList.add('text-yellow-500', 'border-yellow-500/30', 'bg-yellow-500/10');
                els.turboBtn.classList.remove('text-green-400', 'border-green-500/30', 'bg-green-500/10');
            }
        }

        // Initialize with a nice default if text area is empty
        window.onload = () => {
             if(els.prompt.value === '') {
                 // Optional: Set a placeholder or focus
             }
        };

        function resetAll() {
            els.prompt.value = '';
            els.style.value = ""; // Default to "No Style" for better identity preservation
            els.ratio.selectedIndex = 1; // Default 16:9
            els.motion.checked = false;
            els.hd.checked = true;
            els.img.classList.add('hidden');
            els.empty.classList.remove('hidden');
            els.actions.classList.add('hidden');
            state.currentUrl = null;
            updateStatus('online', 'System Online');
        }

        function toggleHistory() {
            els.historyPanel.classList.toggle('translate-x-full');
        }

        // --- Generation Logic ---

        // --- Generation Logic (Advanced Multi-Stage Fallback) ---

        const MODELS = ['flux', 'turbo']; // Primary, Secondary
        
        async function generateImage() {
            const rawPrompt = els.prompt.value.trim();
            
            if (!rawPrompt) {
                els.prompt.classList.add('border-red-500');
                setTimeout(() => els.prompt.classList.remove('border-red-500'), 1000);
                return;
            }

            // Reset UI
            state.isGenerating = true;
            els.loader.classList.remove('hidden');
            els.empty.classList.add('hidden');
            els.img.classList.add('hidden');
            els.actions.classList.add('hidden');
            els.btn.disabled = true;
            els.btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Connecting...`;
            
            updateStatus('busy', 'Initializing...');

            // Strategy: Try Flux -> Try Turbo -> Fail
            // We use a recursive approach or loop to try models
            
            let success = false;
            const strategies = [
                { model: 'flux', name: 'High-Fidelity Core', timeout: 25000 },
                { model: 'turbo', name: 'Turbo Engine', timeout: 15000 }, // Faster fallback
                { model: 'flux', name: 'Backup Core', timeout: 30000 } // Last resort retry
            ];

            // If Turbo Mode is manually enabled, skip the first Flux attempt
            if (state.turbo) {
                strategies.shift();
            }

            for (let i = 0; i < strategies.length; i++) {
                if (success) break;
                
                const strategy = strategies[i];
                els.loadingText.innerText = `Attempt ${i+1}/${strategies.length}: ${strategy.name}...`;
                
                try {
                    await attemptGeneration(rawPrompt, strategy.model, strategy.timeout);
                    success = true;
                } catch (e) {
                    console.warn(`${strategy.name} failed:`, e);
                    if (i < strategies.length - 1) {
                        els.loadingText.innerText = `Rerouting to ${strategies[i+1].name}...`;
                        await new Promise(r => setTimeout(r, 1000)); // Brief pause before switch
                    }
                }
            }

            if (!success) {
                clearInterval(window.stageInterval);
                alert("All generation servers are currently overwhelmed. Please wait 30 seconds and try again.");
                resetUI();
                updateStatus('error', 'System Overloaded');
            }
        }

        function attemptGeneration(rawPrompt, model, timeoutMs) {
            return new Promise((resolve, reject) => {
                
                // Construct URL
                const style = els.style.value;
                const isHD = els.hd.checked;
                
                let finalPrompt = rawPrompt;
                
                // STRICT IDENTITY PROTECTION
                // We append style tags at the end, but if the user entered a name, we rely on 'enhance=false'
                if (style) finalPrompt += `, ${style}`;
                if (isHD) finalPrompt += ", 8k resolution, photorealistic, highly detailed";

                // Dimensions
                let width = 1024, height = 1024;
                const ratioMap = {
                    '1:1': [1024, 1024],
                    '16:9': [1280, 720],
                    '9:16': [720, 1280],
                    '4:3': [1024, 768],
                    '3:2': [1200, 800],
                    '2:3': [800, 1200],
                    '21:9': [1536, 640]
                };
                [width, height] = ratioMap[els.ratio.value] || [1024, 1024];

                // Resolution scaling for speed/model
                if (model === 'turbo') {
                    width = Math.floor(width * 0.8);
                    height = Math.floor(height * 0.8);
                }

                const seed = Math.floor(Math.random() * 1000000000);
                // nologo=true removes watermarks
                // enhance=false PREVENTS Prompt rewriting (Crucial for identities like Virat Kohli)
                // safe=true adds a safety filter (optional, but good for public projects)
                const encodedPrompt = encodeURIComponent(finalPrompt);
                const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&model=${model}&enhance=false`;

                const imgObj = new Image();
                let timer = null;
                let isDone = false;

                timer = setTimeout(() => {
                    if(!isDone) {
                        isDone = true;
                        imgObj.src = "";
                        reject(new Error("Timeout"));
                    }
                }, timeoutMs);

                imgObj.onload = () => {
                    if(!isDone) {
                        isDone = true;
                        clearTimeout(timer);
                        finishGeneration(url, rawPrompt);
                        resolve();
                    }
                };

                imgObj.onerror = () => {
                    if(!isDone) {
                        isDone = true;
                        clearTimeout(timer);
                        reject(new Error("Load Error"));
                    }
                };

                imgObj.src = url;
            });
        }

        function updateStatus(type, text) {
            const indicator = document.getElementById('statusIndicator');
            const label = document.getElementById('statusText');
            
            label.innerText = text;
            
            if (type === 'busy') {
                indicator.className = "w-1.5 h-1.5 bg-yellow-500 rounded-full animate-ping";
                label.className = "text-[10px] text-yellow-500 uppercase tracking-widest";
            } else if (type === 'error') {
                indicator.className = "w-1.5 h-1.5 bg-red-500 rounded-full";
                label.className = "text-[10px] text-red-500 uppercase tracking-widest";
            } else {
                indicator.className = "w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse";
                label.className = "text-[10px] text-gray-400 uppercase tracking-widest";
            }
        }

        function finishGeneration(url, originalPrompt) {
            els.img.src = url;
            state.currentUrl = url;
            state.currentPrompt = originalPrompt;

            // Update History
            addToHistory(url, originalPrompt);

            // Show Result
            els.loader.classList.add('hidden');
            els.img.classList.remove('hidden');
            els.actions.classList.remove('hidden');
            
            // Check Motion
            applyMotion();

            resetUI();
            updateStatus('online', 'System Online');
        }

        function resetUI() {
            state.isGenerating = false;
            els.btn.disabled = false;
            els.btn.innerHTML = `<i class="fa-solid fa-bolt"></i> Generate Reality`;
            
            // Revert status if it was stuck on busy
            if (document.getElementById('statusText').innerText === 'Initializing...') {
                 updateStatus('online', 'System Online');
            }
        }

        function applyMotion() {
            if (els.motion.checked) {
                els.img.classList.add('motion-active');
                // Ensure image covers area for pan effect
                els.img.style.width = "110%";
                els.img.style.height = "110%";
                els.img.style.maxWidth = "none";
                els.imgContainer.style.overflow = "hidden";
            } else {
                els.img.classList.remove('motion-active');
                els.img.style.width = "";
                els.img.style.height = "";
                els.img.style.maxWidth = "100%";
            }
        }

        // Listener for motion toggle change after generation
        els.motion.addEventListener('change', applyMotion);

        // --- History & Utils ---

        function addToHistory(url, prompt) {
            state.history.unshift({ url, prompt });
            renderHistory();
        }

        function renderHistory() {
            const container = els.historyGrid;
            container.innerHTML = '';
            
            state.history.forEach(item => {
                const div = document.createElement('div');
                div.className = "relative group rounded-lg overflow-hidden cursor-pointer border border-gray-800 hover:border-blue-500 transition aspect-square";
                div.innerHTML = `
                    <img src="${item.url}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center p-2 text-center">
                        <span class="text-[10px] text-white line-clamp-3">${item.prompt}</span>
                    </div>
                `;
                div.onclick = () => {
                    els.img.src = item.url;
                    state.currentUrl = item.url;
                    els.img.classList.remove('hidden');
                    els.empty.classList.add('hidden');
                    els.actions.classList.remove('hidden');
                    applyMotion();
                };
                container.appendChild(div);
            });
        }

        async function downloadImage() {
            if (!state.currentUrl) return;
            const a = document.createElement('a');
            a.href = state.currentUrl;
            a.download = `RealismX-${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                els.imgContainer.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function shareImage() {
            if(navigator.share && state.currentUrl) {
                navigator.share({
                    title: 'Created with RealismX',
                    text: 'Check out this AI generated art!',
                    url: state.currentUrl
                });
            } else {
                alert('URL copied to clipboard!');
                navigator.clipboard.writeText(state.currentUrl);
            }
        }

        // Enter Key support
        els.prompt.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateImage();
            }
        });

    </script>
</body>
</html>
